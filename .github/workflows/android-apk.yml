name: Trans-nayo APK Android

on:
  push:
    branches: ['main', 'master', 'claude/trans-nayo-mobile-app-kwnqlg']
    paths: ['trans-nayo/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: trans-nayo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trans-nayo/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifications (types et lint)
        run: |
          npx tsc --noEmit
          npx expo lint

      - name: Générer le projet Android
        run: npx expo prebuild --platform android --no-install

      - name: Compiler l'APK (release)
        working-directory: trans-nayo/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Trans-nayo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Trans-nayo-apk
          path: trans-nayo/Trans-nayo.apk

      - name: Publier une release téléchargeable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: trans-nayo-build-${{ github.run_number }}
          name: Trans-nayo (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: trans-nayo/Trans-nayo.apk
          body: |
            APK Android de Trans-nayo, prêt à installer.

            1. Téléchargez **Trans-nayo.apk** ci-dessous depuis votre téléphone Android.
            2. Ouvrez le fichier et autorisez l'installation depuis cette source si Android le demande.
            3. Lancez Trans-nayo.

            Commit : ${{ github.sha }}
