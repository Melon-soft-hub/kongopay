name: Trans-nayo APK Android

on:
  push:
    branches: ['main', 'master', 'claude/trans-nayo-mobile-app-kwnqlg']
    paths: ['trans-nayo/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: trans-nayo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trans-nayo/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifications (types et lint)
        run: |
          npx tsc --noEmit
          npx expo lint

      - name: Générer le projet Android
        run: npx expo prebuild --platform android --no-install

      # Un APK par architecture : chaque fichier est bien plus léger qu'un APK universel.
      - name: Compiler l'APK 64 bits (téléphones récents)
        working-directory: trans-nayo/android
        run: |
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
          cp app/build/outputs/apk/release/app-release.apk ../Trans-nayo.apk

      - name: Compiler l'APK 32 bits (anciens téléphones)
        working-directory: trans-nayo/android
        run: |
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a
          cp app/build/outputs/apk/release/app-release.apk ../Trans-nayo-32bits.apk

      # APK x86_64 réservé au test : l'émulateur (processeur Intel) ne sait pas traduire
      # toutes les instructions ARM du moteur JavaScript Hermes. Même code, même configuration.
      - name: Compiler l'APK de test pour l'émulateur (x86_64)
        working-directory: trans-nayo/android
        run: |
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
          cp app/build/outputs/apk/release/app-release.apk ../test-x86_64.apk

      - name: Tailles
        run: ls -lh *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Trans-nayo-apk
          path: trans-nayo/Trans-nayo*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk-test-emulateur
          path: trans-nayo/test-x86_64.apk

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk-test-emulateur
          path: apks

      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Tester l'APK sur un émulateur Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 trans-nayo/scripts/smoke_test.py apks/test-x86_64.apk smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-emulateur
          path: smoke/

  release:
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Trans-nayo-apk
          path: apks

      - uses: actions/download-artifact@v4
        with:
          name: captures-emulateur
          path: captures

      - name: Regrouper les captures du test
        run: cd captures && zip -q ../apks/captures-emulateur.zip *.png

      - name: Publier une release téléchargeable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: trans-nayo-build-${{ github.run_number }}
          name: Trans-nayo (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: |
            apks/Trans-nayo.apk
            apks/Trans-nayo-32bits.apk
            apks/captures-emulateur.zip
          body: |
            APK Android de Trans-nayo, testé automatiquement sur un émulateur Android.

            - **Trans-nayo.apk** : pour la plupart des téléphones (64 bits).
            - **Trans-nayo-32bits.apk** : pour les anciens téléphones ou Android Go, si le premier refuse de s'installer.
            - *captures-emulateur.zip* : captures d'écran du test automatique (inutile pour installer l'app).

            1. Ouvrez ce lien dans **Chrome** sur votre téléphone Android (de préférence en Wi-Fi).
            2. Touchez le fichier pour le télécharger, puis ouvrez-le.
            3. Autorisez l'installation depuis cette source si Android le demande, puis lancez Trans-nayo.

            Commit : ${{ github.sha }}
